name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-bun.yml@7cc8a6c981cbec10fcb7f19bd75b36e9ee65ea7e
    secrets: inherit
    with:
      cask-template: .github/formula/cc-pane.rb.tmpl
      smoke-command: "--version"
